name: Verify first delivery
on: [push, pull_request]
jobs:
  verify:
    # Keep the runner compatible with the pinned Playwright browser dependencies.
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: proco_test
          POSTGRES_USER: proco
          POSTGRES_PASSWORD: proco-local
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U proco -d proco_test"
          --health-interval 3s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: mvn -B -f backend/pom.xml verify
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run build
      - run: cd frontend && npx playwright install --with-deps chromium --only-shell
      - name: Start application for browser tests
        run: |
          DB_URL=jdbc:postgresql://localhost:5432/proco_test java -jar backend/target/simulator-0.1.0.jar > /tmp/proco-backend.log 2>&1 &
          npm --prefix frontend run dev > /tmp/proco-frontend.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS -u 'almacen:Simulacion123!' http://localhost:8080/api/me; then break; fi
            sleep 1
          done
          curl -fsS -u 'almacen:Simulacion123!' http://localhost:8080/api/me
      - run: npm --prefix frontend run test:e2e
        env:
          E2E_URL: http://127.0.0.1:5173
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification
          path: |
            backend/target/surefire-reports
            frontend/test-results
            /tmp/proco-backend.log
            /tmp/proco-frontend.log
