name: Verify PROCO simulator
on: [push, pull_request]
jobs:
  verify:
    # Keep the runner compatible with the pinned Playwright browser dependencies.
    runs-on: ubuntu-24.04
    env:
      DB_PORT: 55432
      BACKEND_PORT: 18081
      FRONTEND_PORT: 18088
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: proco_test
          POSTGRES_USER: proco
          POSTGRES_PASSWORD: proco-local
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U proco -d proco_test"
          --health-interval 3s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: mvn -B -f backend/pom.xml verify
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run build
      - run: cd frontend && npx playwright install --with-deps chromium --only-shell
      - name: Start isolated Docker Compose application
        run: |
          docker compose -p proco-ci up -d --build > /tmp/proco-compose-build.log 2>&1
          for i in $(seq 1 60); do
            if curl -fsS -u 'almacen:Simulacion123!' http://localhost:18088/api/me; then break; fi
            sleep 1
          done
          curl -fsS -u 'almacen:Simulacion123!' http://localhost:18088/api/me
      - run: npm --prefix frontend run test:e2e
        env:
          E2E_URL: http://127.0.0.1:18088
      - name: Verify material, supplier workflows and OLA persistence after restart
        run: |
          python3 scripts/verify-sprint4-restart.py --project proco-ci --url http://127.0.0.1:18088 > /tmp/proco-restart-verification.log
          cat /tmp/proco-restart-verification.log
      - name: Collect Compose logs
        if: always()
        run: docker compose -p proco-ci logs --no-color > /tmp/proco-compose.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification
          path: |
            backend/target/surefire-reports
            frontend/test-results
            /tmp/proco-compose-build.log
            /tmp/proco-compose.log
            /tmp/proco-restart-verification.log
